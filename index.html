<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض عائشة وهاجر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #e8e3d5;
      --card-bg: #f5f2eb;
      --primary-color: #4a5d4e;
      --text-color: #2b2b2b;
      --danger-color: #a84242;
      --accent-color: #6b7a6e;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid var(--primary-color);
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      color: var(--primary-color);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .upload-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 40px;
      border: 1px solid #dcd6c8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background-color: #fff;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #3b4b3f;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .art-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      border: 1px solid #dcd6c8;
      display: flex;
      flex-direction: column;
    }

    .art-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .art-info {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .art-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 5px 0;
    }

    .art-artist {
      display: inline-block;
      background: var(--primary-color);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
      width: fit-content;
    }

    .art-description {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      border-top: 1px solid #e0dab;
      padding-top: 10px;
    }

    .btn-edit {
      background-color: var(--accent-color);
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-delete {
      background-color: var(--danger-color);
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-delete:hover {
      background-color: #873333;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>معرض عائشة وهاجر</h1>
  </header>

  <div class="container">
    
    <!-- قسم إضافة اللوحة -->
    <div class="upload-section">
      <h2>إضافة لوحة جديدة للمعرض</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label for="title">عنوان اللوحة:</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="artist">الفنانة:</label>
          <select id="artist" required>
            <option value="عائشة">عائشة</option>
            <option value="هاجر">هاجر</option>
          </select>
        </div>

        <div class="form-group">
          <label for="image">صورة اللوحة:</label>
          <input type="file" id="image" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="description">وصف اللوحة:</label>
          <textarea id="description" rows="3"></textarea>
        </div>

        <button type="submit" id="submitBtn">نشر اللوحة</button>
      </form>
    </div>

    <!-- شبكة عرض اللوحات -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- يتم تحميل اللوحات هنا برمجياً -->
    </div>

  </div>

  <footer>
    جميع الحقوق محفوظة © معرض عائشة وهاجر 2026
  </footer>

  <script>
    // إعدادات Supabase
    const SUPABASE_URL = 'https://bphewlrauaciedwzxjr.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // استبدليها بـ Anon Key الخاص بمشروعك
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const galleryGrid = document.getElementById('galleryGrid');
    const uploadForm = document.getElementById('uploadForm');

    // تحميل اللوحات عند فتح الصفحة
    async function fetchArtworks() {
      galleryGrid.innerHTML = '<p>جاري تحميل اللوحات...</p>';
      
      const { data, error } = await supabase
        .from('artworks')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        galleryGrid.innerHTML = `<p>حدث خطأ أثناء تحميل اللوحات: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        galleryGrid.innerHTML = '<p>لا توجد لوحات معروضة حالياً.</p>';
        return;
      }

      galleryGrid.innerHTML = '';
      data.forEach(art => {
        const card = document.createElement('div');
        card.className = 'art-card';
        card.innerHTML = `
          <img src="${art.image_url}" alt="${art.title}" class="art-image">
          <div class="art-info">
            <h3 class="art-title">${art.title}</h3>
            <span class="art-artist">${art.artist}</span>
            <p class="art-description">${art.description || 'بدون وصف'}</p>
            <div class="card-actions">
              <button class="btn-edit" onclick="editArtwork('${art.id}', '${art.title}', '${art.description || ''}')">تعديل</button>
              <button class="btn-delete" onclick="deleteArtwork('${art.id}')">حذف</button>
            </div>
          </div>
        `;
        galleryGrid.appendChild(card);
      });
    }

    // إضافة لوحة جديدة
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري النشر...';

      const title = document.getElementById('title').value;
      const artist = document.getElementById('artist').value;
      const description = document.getElementById('description').value;
      const fileInput = document.getElementById('image');
      const file = fileInput.files[0];

      if (!file) {
        alert('الرجاء اختيار صورة!');
        submitBtn.disabled = false;
        submitBtn.innerText = 'نشر اللوحة';
        return;
      }

      try {
        // 1. رفع الصورة لـ Storage
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { data: storageData, error: storageError } = await supabase.storage
          .from('artworks')
          .upload(fileName, file);

        if (storageError) throw storageError;

        // 2. الحصول على رابط الصورة المباشر
        const { data: urlData } = supabase.storage
          .from('artworks')
          .getPublicUrl(fileName);

        const imageUrl = urlData.publicUrl;

        // 3. حفظ بيانات اللوحة في الجدول
        const { error: dbError } = await supabase
          .from('artworks')
          .insert([
            { title: title, artist: artist, description: description, image_url: imageUrl }
          ]);

        if (dbError) throw dbError;

        alert('تم نشر اللوحة بنجاح!');
        uploadForm.reset();
        fetchArtworks();

      } catch (err) {
        alert('خطأ أثناء النشر: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'نشر اللوحة';
      }
    });

    // دالة حذف اللوحة
    async function deleteArtwork(id) {
      if (confirm('هل أنتِ متأكدة من رغبتكِ في حذف هذه اللوحة؟')) {
        const { error } = await supabase
          .from('artworks')
          .delete()
          .eq('id', id);

        if (error) {
          alert('خطأ أثناء الحذف: ' + error.message);
        } else {
          alert('تم حذف اللوحة بنجاح!');
          fetchArtworks();
        }
      }
    }

    // دالة تعديل اللوحة
    async function editArtwork(id, oldTitle, oldDescription) {
      const newTitle = prompt('تعديل عنوان اللوحة:', oldTitle);
      if (newTitle === null) return; // تم إلغاء الأمر

      const newDescription = prompt('تعديل وصف اللوحة:', oldDescription);
      if (newDescription === null) return;

      const { error } = await supabase
        .from('artworks')
        .update({ title: newTitle, description: newDescription })
        .eq('id', id);

      if (error) {
        alert('خطأ أثناء التعديل: ' + error.message);
      } else {
        alert('تم تعديل اللوحة بنجاح!');
        fetchArtworks();
      }
    }

    // تشغيل جلب اللوحات عند فتح الصفحة
    fetchArtworks();
  </script>
</body>
</html>
