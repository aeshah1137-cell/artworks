<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الفن الحديث | عائشة وهاجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --deep-brown: #362219;
            --warm-beige: #F4EAD3;
            --olive-green: #5B7052;
            --soft-beige: #FAF6ED;
            --danger-red: #A84242;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--warm-beige);
            color: var(--deep-brown);
            line-height: 1.6;
        }

        .auth-bar {
            background-color: var(--deep-brown);
            color: var(--soft-beige);
            padding: 0.6rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .auth-btn {
            background-color: var(--olive-green);
            color: var(--soft-beige);
            border: 1px solid var(--soft-beige);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        header {
            background-color: var(--deep-brown);
            color: var(--soft-beige);
            padding: 3rem 1.5rem;
            text-align: center;
            border-bottom: 8px solid var(--olive-green);
        }

        header h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.2rem;
            color: var(--warm-beige);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            background-color: var(--olive-green);
            border-bottom: 4px solid var(--deep-brown);
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--soft-beige);
            color: var(--deep-brown);
            border: 2px solid var(--deep-brown);
            padding: 0.5rem 1.5rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--deep-brown);
        }

        .filter-btn.active {
            background-color: var(--deep-brown);
            color: var(--soft-beige);
            box-shadow: 5px 5px 0px var(--olive-green);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .upload-section {
            display: none;
            background-color: var(--soft-beige);
            border: 4px solid var(--deep-brown);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 8px 8px 0px var(--olive-green);
        }

        .upload-section.active {
            display: block;
        }

        .upload-section h2 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
            color: var(--deep-brown);
            text-align: center;
        }

        .upload-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        input, textarea, select {
            padding: 0.7rem;
            border: 2px solid var(--deep-brown);
            border-radius: 8px;
            background-color: var(--warm-beige);
            color: var(--deep-brown);
            font-size: 1rem;
        }

        .submit-btn {
            grid-column: span 2;
            background-color: var(--olive-green);
            color: var(--soft-beige);
            border: 3px solid var(--deep-brown);
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--deep-brown);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .art-card {
            background: var(--soft-beige);
            border: 3px solid var(--deep-brown);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 6px 6px 0px var(--olive-green);
            display: flex;
            flex-direction: column;
        }

        .art-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 3px solid var(--deep-brown);
        }

        .art-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .art-title {
            font-size: 1.3rem;
            font-weight: 900;
        }

        .art-artist {
            display: inline-block;
            background-color: var(--olive-green);
            color: var(--soft-beige);
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            width: fit-content;
        }

        .admin-actions {
            display: none;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 2px dashed var(--deep-brown);
        }

        .admin-actions.active {
            display: flex;
        }

        .action-btn {
            flex: 1;
            padding: 0.4rem 0.6rem;
            border: 2px solid var(--deep-brown);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-edit {
            background-color: var(--warm-beige);
            color: var(--deep-brown);
        }

        .btn-delete {
            background-color: var(--danger-red);
            color: var(--soft-beige);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active { display: flex; }

        .modal-body {
            background: var(--soft-beige);
            border: 4px solid var(--deep-brown);
            padding: 2rem;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--deep-brown);
            color: var(--soft-beige);
            margin-top: 4rem;
            border-top: 4px solid var(--olive-green);
        }
    </style>
</head>
<body>

    <div class="auth-bar">
        <span id="userStatus">وضع الزائر</span>
        <div>
            <button class="auth-btn" id="loginBtn" onclick="toggleModal(true)">تسجيل دخول الرسامين</button>
            <button class="auth-btn" id="logoutBtn" style="display:none;" onclick="logout()">تسجيل خروج</button>
        </div>
    </div>

    <header>
        <h1>معرض الفن الحديث</h1>
        <p>رسومات وفنون بأيدي عائشة وهاجر</p>
    </header>

    <nav>
        <button class="filter-btn active" onclick="filterArt('all', event)">الكل</button>
        <button class="filter-btn" onclick="filterArt('aisha', event)">رسومات عائشة</button>
        <button class="filter-btn" onclick="filterArt('hajer', event)">رسومات هاجر</button>
    </nav>

    <div class="container">
        <!-- Upload Form -->
        <section class="upload-section" id="uploadSection">
            <h2>إضافة لوحة جديدة للمعرض</h2>
            <form class="upload-form" id="artworkForm">
                <div class="form-group">
                    <label>عنوان اللوحة:</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>الفنانة:</label>
                    <select id="artist" required>
                        <option value="aisha">عائشة</option>
                        <option value="hajer">هاجر</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>صورة اللوحة:</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="form-group full-width">
                    <label>وصف اللوحة:</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">نشر اللوحة</button>
            </form>
        </section>

        <!-- Gallery -->
        <div class="gallery-grid" id="gallery"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-body">
            <h3>تسجيل الدخول</h3>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button class="submit-btn" onclick="login()">دخول</button>
            <button class="auth-btn" onclick="toggleModal(false)" style="background:#888;">إلغاء</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-body">
            <h3>تعديل اللوحة</h3>
            <input type="text" id="editTitle" placeholder="عنوان اللوحة">
            <textarea id="editDescription" rows="4" placeholder="وصف اللوحة"></textarea>
            <button class="submit-btn" onclick="saveEdit()">حفظ التعديل</button>
            <button class="auth-btn" onclick="closeEdit()" style="background:#888;">إلغاء</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © معرض عائشة وهاجر 2026</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://bphewlrauuaciedwzxjr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwaGV3bHJhdXVhY2llZHd6eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODMzMzksImV4cCI6MjEwNTc1OTMzOX0.Ytifn_wCc-RXTfe_hL_nWCCK6f5YtLt3ffOSGIjcYJw";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let artworksCache = {};
        let editingId = null;

        // حماية من أكواد ملغومة داخل العنوان أو الوصف
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : String(str);
            return d.innerHTML;
        }

        // Session Handling
        _supabase.auth.onAuthStateChange((event, session) => {
            currentUser = session?.user || null;
            const uploadSection = document.getElementById('uploadSection');
            const userStatus = document.getElementById('userStatus');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            if (currentUser) {
                let displayName = "الفنانة 🤎";

                if (currentUser.email === 'haa784845@gmail.com') {
                    displayName = "الفنانة هاجر 🤎";
                } else if (currentUser.email === 'aishaghalb85@gmail.com') {
                    displayName = "الفنانة عائشة 🤎";
                }

                userStatus.textContent = `أهلاً بك: (${displayName})`;
                uploadSection.classList.add('active');
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
            } else {
                userStatus.textContent = 'وضع الزائر';
                uploadSection.classList.remove('active');
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            }

            // إظهار أو إخفاء أزرار التعديل والحذف حسب تسجيل الدخول
            document.querySelectorAll('.admin-actions').forEach(el => {
                el.classList.toggle('active', !!currentUser);
            });
        });

        // Fetch Artworks
        async function loadArtworks() {
            const { data, error } = await _supabase.from('artworks').select('*').order('id', { ascending: false });
            if (error) return console.error(error);

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            artworksCache = {};

            data.forEach(item => {
                artworksCache[item.id] = item;

                const card = document.createElement('div');
                card.className = 'art-card';
                card.setAttribute('data-artist', item.artist);

                card.innerHTML = `
                    <img src="${esc(item.image_url)}" class="art-img" alt="${esc(item.title)}">
                    <div class="art-info">
                        <div class="art-title">${esc(item.title)}</div>
                        <span class="art-artist">${item.artist === 'aisha' ? 'عائشة' : 'هاجر'}</span>
                        <p>${esc(item.description)}</p>
                        <div class="admin-actions ${currentUser ? 'active' : ''}">
                            <button class="action-btn btn-edit" data-id="${item.id}">تعديل</button>
                            <button class="action-btn btn-delete" data-id="${item.id}">حذف</button>
                        </div>
                    </div>
                `;

                card.querySelector('.btn-edit').addEventListener('click', () => openEdit(item.id));
                card.querySelector('.btn-delete').addEventListener('click', () => deleteArtwork(item.id));

                gallery.appendChild(card);
            });
        }

        // Upload Artwork
        document.getElementById('artworkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const file = document.getElementById('imageFile').files[0];
            const reader = new FileReader();

            reader.onload = async (evt) => {
                const { error } = await _supabase.from('artworks').insert([{
                    title: document.getElementById('title').value,
                    artist: document.getElementById('artist').value,
                    description: document.getElementById('description').value,
                    image_url: evt.target.result
                }]);

                submitBtn.disabled = false;
                if (!error) {
                    document.getElementById('artworkForm').reset();
                    loadArtworks();
                } else {
                    alert('خطأ أثناء النشر: ' + error.message);
                }
            };
            reader.readAsDataURL(file);
        });

        // حذف
        async function deleteArtwork(id) {
            if (!confirm("هل أنتِ متأكدة من رغبتكِ في حذف هذه اللوحة؟")) return;

            const { data, error } = await _supabase.from('artworks').delete().eq('id', id).select();
            if (error) {
                alert("خطأ أثناء الحذف: " + error.message);
            } else if (!data || data.length === 0) {
                alert("ما انحذفت اللوحة، تأكدي من صلاحيات الحذف في Supabase.");
            } else {
                loadArtworks();
            }
        }

        // تعديل
        function openEdit(id) {
            const item = artworksCache[id];
            if (!item) return;
            editingId = id;
            document.getElementById('editTitle').value = item.title || '';
            document.getElementById('editDescription').value = item.description || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEdit() {
            editingId = null;
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveEdit() {
            if (editingId === null) return;
            const newTitle = document.getElementById('editTitle').value.trim();
            const newDescription = document.getElementById('editDescription').value;

            if (!newTitle) {
                alert("العنوان ما يصير يكون فاضي.");
                return;
            }

            const { data, error } = await _supabase.from('artworks')
                .update({ title: newTitle, description: newDescription })
                .eq('id', editingId)
                .select();

            if (error) {
                alert("خطأ أثناء التعديل: " + error.message);
            } else if (!data || data.length === 0) {
                alert("ما تعدلت اللوحة، تأكدي من صلاحيات التعديل في Supabase.");
            } else {
                closeEdit();
                loadArtworks();
            }
        }

        // Auth Functions
        function toggleModal(show) { document.getElementById('loginModal').classList.toggle('active', show); }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else toggleModal(false);
        }

        async function logout() { await _supabase.auth.signOut(); }

        // Filter
        function filterArt(artist, evt) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            evt.target.classList.add('active');
            document.querySelectorAll('.art-card').forEach(c => {
                c.style.display = (artist === 'all' || c.getAttribute('data-artist') === artist) ? 'flex' : 'none';
            });
        }

        loadArtworks();
    </script>
</body>
</html>
